<section class="projects py-5" [attr.data-theme]="theme">
  <div class="container">
    <h2 class="text-center mb-5">My Projects</h2>

    <div class="row">
      <div class="col-md-4 mb-4" *ngFor="let project of projects">
        <div class="card project-card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ project.title }}</h5>
            <p class="card-text flex-grow-1">{{ project.desc }}</p>

            <div class="tech-list mb-3">
              <span *ngFor="let t of project.tech" class="badge bg-primary me-1">{{ t }}</span>
            </div>

            <div class="mt-auto">
              <a [href]="project.github" target="_blank" class="btn btn-outline-primary btn-sm me-2">
                <i class="fa fa-github me-1"></i> Code
              </a>
              <a [href]="project.live" target="_blank" class="btn btn-primary btn-sm">
                <i class="fa fa-external-link me-1"></i> Live
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
