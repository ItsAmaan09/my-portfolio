<section class="skills py-5" [attr.data-theme]="theme">
  <div class="container">
    <h2 class="mb-4 text-center">My Skills</h2>
    <div class="row">
      <div class="col-md-6 mb-4" *ngFor="let skill of skills">
        <h5>{{ skill.name }}</h5>
        <div class="progress" style="height: 20px">
          <div
            class="progress-bar"
            role="progressbar"
            [style.width.%]="skill.level"
            attr.aria-valuenow="{{ skill.level }}"
          >
            {{ skill.level }}%
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
