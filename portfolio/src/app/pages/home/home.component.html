<section class="hero d-flex align-items-center justify-content-center text-center"  [attr.data-theme]="theme">
  <div class="content">
    <h1 class="fade-in">Hi, I'm <span class="highlight">{{ name }}</span></h1>
    <h3 class="fade-in delay-1">{{ title }}</h3>
    <p class="fade-in delay-2">
      I specialize in building end-to-end web applications using .Net core, Angular, Node.js, and modern technologies.
    </p>
    <div class="mt-4 fade-in delay-3">
      <a routerLink="/projects" class="btn btn-primary me-3">View Projects</a>
      <a routerLink="/contact" class="btn btn-outline-light">Contact Me</a>
    </div>
  </div>
</section>
